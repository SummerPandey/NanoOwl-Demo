# NanoOWL Recycling Classifier Rules
# Defines object detection thresholds and category mappings

detection:
  # Confidence threshold for showing detections.
  # OWL-ViT scores run low (~0.1-0.3 for good matches), so start around 0.1.
  # Raise it if you see false boxes, lower it if real items are missed.
  confidence_threshold: 0.1

  # Duplicate box suppression (NMS)
  nms_threshold: 0.4

  # Max boxes to display per frame
  max_detections: 10

categories:
  # Recyclable materials (GREEN)
  recyclable:
    - plastic bottle
    - aluminum can
    - glass bottle
    - cardboard
    - paper
    - metal can
    - aluminum foil
    - newspaper
    - magazine
    - tin can
    - tennis ball

  # Compostable/Organic (YELLOW - optional, can be mixed)
  compostable:
    - apple
    - banana
    - orange
    - leaf
    - grass
    - food waste

  # Hazardous/Landfill (RED)
  landfill:
    - battery
    - plastic bag
    - styrofoam
    - vinyl
    - plastic film

# Alert settings
alerts:
  # Beep in the dashboard when a landfill item is detected
  # (click the dashboard page once so the browser allows sound)
  sound_enabled: true

  # Alert duration (seconds) - how long to show alert after object removed
  alert_duration: 3

  # Show overlay indicators
  overlay_enabled: true

  # Log detections to ~/.nanoowl-demo/logs/detections.log
  log_enabled: true

dashboard:
  # Dashboard / MJPEG stream port
  port: 7860

  # Refresh rate (FPS)
  fps: 10

  # Enable confidence scores
  show_confidence: true

  # Enable class labels
  show_labels: true
